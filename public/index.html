<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schowek</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f7cff;
      --accent-hover: #3a63e8;
      --danger: #e05555;
      --text: #dde1f0;
      --text-muted: #6b7194;
      --green: #3ecf6a;
      --radius: 10px;
      --mono: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 60px;
    }

    #app { width: 100%; max-width: 700px; }

    /* PIN overlay */
    #pin-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; z-index: 100;
    }
    #pin-overlay h2 { font-size: 1.2rem; color: var(--text-muted); }
    #pin-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 1.4rem;
      letter-spacing: 6px;
      text-align: center;
      width: 180px;
    }
    #pin-error { color: var(--danger); font-size: 0.85rem; min-height: 1em; }

    /* Header */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 24px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    #grab-latest-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    #grab-latest-btn:hover { background: var(--border); }

    /* Input area */
    #input-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 24px;
    }
    #content-input {
      width: 100%; min-height: 120px;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 0.95rem;
      font-family: var(--mono);
      resize: vertical; line-height: 1.5;
    }
    #content-input::placeholder { color: var(--text-muted); }
    #input-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; gap: 10px; flex-wrap: wrap;
    }
    #label-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.82rem;
      flex: 1; min-width: 140px; max-width: 260px;
    }
    #label-input::placeholder { color: var(--text-muted); }
    #label-input:focus { outline: 1px solid var(--accent); color: var(--text); }
    #char-count { color: var(--text-muted); font-size: 0.8rem; }
    #push-btn {
      background: var(--accent);
      color: #fff; border: none;
      border-radius: 8px;
      padding: 8px 22px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    #push-btn:hover { background: var(--accent-hover); }
    #push-btn:active { transform: scale(0.97); }
    #push-btn:disabled { opacity: 0.4; cursor: default; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: var(--green); color: #000;
      border-radius: 8px; padding: 8px 18px;
      font-size: 0.9rem; font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0; z-index: 200; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Clips list */
    #clips-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    #clips-header h2 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    #clear-all-btn {
      background: none; border: none; color: var(--danger);
      font-size: 0.8rem; cursor: pointer; opacity: 0.6;
    }
    #clear-all-btn:hover { opacity: 1; }

    #clips-list { display: flex; flex-direction: column; gap: 8px; }

    .clip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color 0.15s;
    }
    .clip:hover { border-color: var(--accent); }

    .clip-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .clip-preview {
      font-family: var(--mono);
      font-size: 0.875rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
      max-height: 120px;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    }
    .clip-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-copy, .btn-delete {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-copy { background: var(--surface2); color: var(--text); }
    .btn-copy:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-copy.copied { background: var(--green); border-color: var(--green); color: #000; }
    .btn-delete { background: none; color: var(--text-muted); }
    .btn-delete:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

    .clip-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.75rem; color: var(--text-muted);
    }
    .clip-label { color: var(--accent); font-weight: 500; }
    .clip-size { margin-left: auto; }

    #empty-msg {
      color: var(--text-muted);
      text-align: center;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      #input-footer { flex-direction: column; align-items: stretch; }
      #push-btn { width: 100%; }
      .clip-preview { max-height: 80px; }
    }
  </style>
</head>
<body>

<div id="pin-overlay" style="display:none">
  <h2>Podaj PIN</h2>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="12" autofocus>
  <div id="pin-error"></div>
</div>

<div id="app">
  <header>
    <h1>Scho<span>wek</span></h1>
    <button id="grab-latest-btn" title="Skopiuj ostatni wpis do schowka">Złap ostatni</button>
  </header>

  <div id="input-area">
    <textarea id="content-input" placeholder="Wklej tekst, URL, cokolwiek…" spellcheck="false"></textarea>
    <div id="input-footer">
      <input id="label-input" type="text" placeholder="Etykieta (opcjonalna)" maxlength="60">
      <span id="char-count"></span>
      <button id="push-btn">Wrzuć ↑</button>
    </div>
  </div>

  <div id="clips-header">
    <h2>Zapisane</h2>
    <button id="clear-all-btn">Wyczyść wszystko</button>
  </div>

  <div id="clips-list"></div>
  <div id="empty-msg" style="display:none">Schowek pusty</div>
</div>

<div id="toast"></div>

<script>
const API = '/api';
let PIN_HEADER = {};

// Utilities
function toast(msg, color = 'var(--green)') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = color;
  el.style.color = color === 'var(--green)' ? '#000' : '#fff';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...PIN_HEADER },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showPinOverlay(); throw new Error('PIN'); }
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.status); }
  return res.json();
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    toast('Skopiowano!');
    if (btn) {
      btn.textContent = '✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Kopiuj'; btn.classList.remove('copied'); }, 1500);
    }
  }).catch(() => toast('Błąd kopiowania', '#e05555'));
}

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'przed chwilą';
  if (diff < 3600) return `${Math.floor(diff/60)} min temu`;
  if (diff < 86400) return `${Math.floor(diff/3600)} h temu`;
  return d.toLocaleDateString('pl', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function formatSize(n) {
  if (n < 1024) return `${n} B`;
  return `${(n/1024).toFixed(1)} KB`;
}

// Render
function renderClips(clips) {
  const list = document.getElementById('clips-list');
  const empty = document.getElementById('empty-msg');
  if (!clips.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = clips.map(c => `
    <div class="clip" data-id="${c.id}">
      <div class="clip-top">
        <div class="clip-preview">${escHtml(c.preview || '')}</div>
        <div class="clip-actions">
          <button class="btn-copy" data-id="${c.id}">Kopiuj</button>
          <button class="btn-delete" data-id="${c.id}" title="Usuń">✕</button>
        </div>
      </div>
      <div class="clip-meta">
        ${c.label ? `<span class="clip-label">${escHtml(c.label)}</span>` : ''}
        <span>${formatDate(c.created_at)}</span>
        <span class="clip-size">${formatSize(c.size)}</span>
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadClips() {
  try {
    const clips = await api('GET', '/clips');
    renderClips(clips);
  } catch (e) { if (e.message !== 'PIN') toast('Błąd ładowania', '#e05555'); }
}

// PIN overlay
async function showPinOverlay() {
  const overlay = document.getElementById('pin-overlay');
  overlay.style.display = 'flex';
  const input = document.getElementById('pin-input');
  input.value = '';
  input.focus();
  input.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    const val = input.value.trim();
    if (!val) return;
    PIN_HEADER = { 'X-Pin': val };
    try {
      await api('GET', '/clips');
      overlay.style.display = 'none';
      loadClips();
    } catch {
      document.getElementById('pin-error').textContent = 'Nieprawidłowy PIN';
      input.value = '';
    }
  };
}

// Event delegation for copy/delete
document.getElementById('clips-list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;

  if (btn.classList.contains('btn-copy')) {
    try {
      const clip = await api('GET', `/clips/${id}`);
      copyText(clip.content, btn);
    } catch { toast('Błąd', '#e05555'); }
  }

  if (btn.classList.contains('btn-delete')) {
    try {
      await api('DELETE', `/clips/${id}`);
      btn.closest('.clip').remove();
      const remaining = document.querySelectorAll('.clip').length;
      if (!remaining) document.getElementById('empty-msg').style.display = 'block';
    } catch { toast('Błąd usuwania', '#e05555'); }
  }
});

// Push button
const contentInput = document.getElementById('content-input');
const charCount = document.getElementById('char-count');

contentInput.addEventListener('input', () => {
  const n = contentInput.value.length;
  charCount.textContent = n ? `${n.toLocaleString('pl')} zn.` : '';
});

contentInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    document.getElementById('push-btn').click();
  }
});

document.getElementById('push-btn').addEventListener('click', async () => {
  const content = contentInput.value.trim();
  if (!content) { contentInput.focus(); return; }
  const label = document.getElementById('label-input').value.trim();
  const btn = document.getElementById('push-btn');
  btn.disabled = true;
  try {
    await api('POST', '/clips', { content, label: label || undefined });
    contentInput.value = '';
    document.getElementById('label-input').value = '';
    charCount.textContent = '';
    toast('Wrzucono!');
    loadClips();
  } catch (e) { if (e.message !== 'PIN') toast('Błąd: ' + e.message, '#e05555'); }
  finally { btn.disabled = false; }
});

// Grab latest
document.getElementById('grab-latest-btn').addEventListener('click', async () => {
  try {
    const clip = await api('GET', '/clips/latest');
    copyText(clip.content);
  } catch (e) {
    if (e.message !== 'PIN') toast('Schowek pusty', '#e05555');
  }
});

// Clear all
document.getElementById('clear-all-btn').addEventListener('click', async () => {
  if (!confirm('Wyczyścić wszystkie wpisy?')) return;
  try {
    await api('DELETE', '/clips/all');
    renderClips([]);
    toast('Wyczyszczono');
  } catch { toast('Błąd', '#e05555'); }
});

// Init
(async () => {
  const { required } = await fetch(API + '/pin-required').then(r => r.json()).catch(() => ({ required: false }));
  if (required) { showPinOverlay(); return; }
  loadClips();
})();
</script>
</body>
</html>
